<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AMA</title>
  
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .iframe-container {
      position: relative;
      width: 600px;
      height: 468px;   /* crop a little more */
      overflow: hidden;
      box-sizing: border-box;
    }
    iframe {
      position: absolute;
      top: -2px;      /* nudge up slightly */
      left: 0;
      width: 100%;
      height: 550px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe src="https://1up.straw.page/" scrolling="no" allowfullscreen></iframe>
  </div>
</body>
</html>
