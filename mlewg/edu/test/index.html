<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSF2 via Proxy</title>

    <!-- Ruffle Configuration with WebSocket Proxy -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            socket_proxies: [
                {
                    host: "supersmashflash.com",
                    port: 27888,
                    proxyUrl: "ws://localhost:22500"
                }
            ]
        };
    </script>

    <!-- 👇 Override fetch to redirect CORS-blocked URLs through a proxy -->
    <script>
        (function (originalFetch) {
            const changeUrl = function (url) {
                const isHosted = location.hostname.includes("mlew");
                if (!isHosted && url.startsWith("http://www.supersmashflash.com/")) {
                    return url.replace("http://www.supersmashflash.com", "http://localhost:22500");
                }
                return url;
            };

            window.fetch = function () {
                let a = Array.from(arguments);
                if (typeof a[0] === "string") {
                    a[0] = changeUrl(a[0]);
                } else if (a[0] && typeof a[0].url === "string") {
                    const changedUrl = changeUrl(a[0].url);
                    if (changedUrl !== a[0].url) {
                        a[0] = changedUrl;
                    }
                }
                return originalFetch.apply(window, a);
            };
        })(window.fetch);
    </script>

    <!-- Load Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f0f0f;
            overflow: hidden;
        }

        #player {
            width: 100vw;
            height: 100vh;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
            const container = document.getElementById("player");

            if (ruffle && container) {
                const player = ruffle.createPlayer();

                // 👇 Always spoof original domain (needed for multiplayer logic)
                player.setAttribute("data-url", "http://www.supersmashflash.com");

                player.style.width = "100%";
                player.style.height = "100%";
                container.appendChild(player);

                // 👇 Use different SWF URLs depending on host
                const isHosted = location.hostname.includes("mlew");
                const swfUrl = isHosted
                    ? "http://www.supersmashflash.com/flash/games/SSF2Beta_v1_3_1_2_hacked.swf"
                    : "../test/SSF2Beta_v1_3_1_2_hacked.swf";

                player.load(swfUrl);
            } else {
                console.error("Ruffle failed to initialize.");
            }
        });
    </script>
</body>
</html>
