<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSF2 via Proxy</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f0f0f;
            overflow: hidden;
        }

        #player {
            width: 100vw;
            height: 100vh;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
            const container = document.getElementById("player");

            if (ruffle && container) {
                const player = ruffle.createPlayer();

                // Simulate the SWF coming from supersmashflash.com
                player.setAttribute("data-url", "https://www.supersmashflash.com/flash/games/SSF2Beta_v1_4_0_1");

                player.style.width = "100%";
                player.style.height = "100%";
                container.appendChild(player);

                // Load via Ruffle proxy at localhost:22500
                // This assumes your proxy routes or hosts the SWF at this path:
                const swfPath = "http://localhost:22500/flash/games/SSF2Beta_v1_3_1_2_hacked.swf";

                player.load(swfPath);
            } else {
                console.error("Ruffle failed to initialize.");
            }
        });
    </script>
</body>
</html>
