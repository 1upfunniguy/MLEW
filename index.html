        { file: "18 LITTLEST DOG.m4a", title: "LITTLEST DOG", artist: "OLLIE LOKO" },
        { file: "19 GREEDY.m4a", title: "GREEDY", artist: "OLLIE LOKO" },
        { file: "20 HANDS IN AIR.m4a", title: "HANDS IN AIR", artist: "OLLIE LOKO" },
        { file: "21 GONNA FLY.m4a", title: "GONNA FLY", artist: "OLLIE LOKO" },
      ];

      // Selectors
      const audio = document.getElementById('audioPlayer');
      const toggleBtn = document.getElementById('toggleBtn');
      const skipBtn = document.getElementById('skipBtn');
      const songNameElem = document.getElementById('songName');
      const artistNameElem = document.getElementById('artistName');
      const playlistElem = document.getElementById('playlist');
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');

      let currentTrackIndex = 0;
      let isPlaying = true;

      // Load the first song initially
      function loadTrack(index) {
        if (index < 0) index = playlist.length - 1;
        if (index >= playlist.length) index = 0;
        currentTrackIndex = index;
        const track = playlist[currentTrackIndex];
        audio.src = `../mlewg/music/${track.file}`;
        songNameElem.textContent = track.title;
        artistNameElem.textContent = track.artist;

        updatePlaylistHighlight();

        // Play right away
        audio.play().catch(e => {
          // Autoplay might be blocked, just catch the error silently
          isPlaying = false;
          toggleBtn.textContent = "Play";
          toggleBtn.setAttribute('aria-pressed', 'false');
        });
      }

      // Update the playlist UI highlighting current track
      function updatePlaylistHighlight() {
        const tracks = playlistElem.querySelectorAll('.track');
        tracks.forEach((el, i) => {
          if (i === currentTrackIndex) {
            el.classList.add('active');
            el.setAttribute('aria-current', 'true');
          } else {
            el.classList.remove('active');
            el.removeAttribute('aria-current');
          }
        });
      }

      // Setup playlist UI
      playlist.forEach((track, i) => {
        const trackElem = document.createElement('div');
        trackElem.classList.add('track');
        trackElem.textContent = `${track.title} - ${track.artist}`;
        trackElem.setAttribute('role', 'listitem');
        trackElem.tabIndex = 0;
        trackElem.addEventListener('click', () => {
          loadTrack(i);
        });
        trackElem.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            loadTrack(i);
          }
        });
        playlistElem.appendChild(trackElem);
      });

      // Play/Pause toggle
      toggleBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          isPlaying = true;
          toggleBtn.textContent = 'Pause';
          toggleBtn.setAttribute('aria-pressed', 'true');
        } else {
          audio.pause();
          isPlaying = false;
          toggleBtn.textContent = 'Play';
          toggleBtn.setAttribute('aria-pressed', 'false');
        }
      });

      // Skip button
      skipBtn.addEventListener('click', () => {
        currentTrackIndex++;
        if (currentTrackIndex >= playlist.length) {
          currentTrackIndex = 0;
        }
        loadTrack(currentTrackIndex);
      });

      // Auto skip on track end
      audio.addEventListener('ended', () => {
        skipBtn.click();
      });

      // Audio Visualizer Setup
      let audioContext;
      let analyser;
      let source;
      let dataArray;
      let bufferLength;

      function setupVisualizer() {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          source = audioContext.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioContext.destination);
          analyser.fftSize = 64;
          bufferLength = analyser.frequencyBinCount;
          dataArray = new Uint8Array(bufferLength);
          drawVisualizer();
        } catch (e) {
          console.warn("Web Audio API is not supported in this browser");
        }
      }

      function drawVisualizer() {
        requestAnimationFrame(drawVisualizer);
        if (!analyser) return;

        analyser.getByteFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 1.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = dataArray[i];
          ctx.fillStyle = `rgb(${barHeight + 100}, 255, 50)`;
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 2;
        }
      }

      // Resize canvas for visualizer
      function resizeCanvas() {
        canvas.width = Math.min(window.innerWidth, 600);
        canvas.height = 100;
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
      });

      resizeCanvas();
      setupVisualizer();

      // Load first track on page load
      loadTrack(0);
    });
