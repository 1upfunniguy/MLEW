    .dropdown-menu p {

    .dropdown-item {
      padding: 10px;
      color: lightgreen;
      text-decoration: none;
      display: block;
      transition: background-color 0.3s, color 0.3s;

       Gay Animation Just Like Me FrFr
    ===================================================== */

      33.33% { color: yellow; }
      50% { color: green; }
      66.67% { color: blue; }
      83.33% { color: indigo; }

  <script>
    // Disable Right-Click
    function disableRightClick() {
      alert("Hi imma steal u press ok NOW!!!");
      window.location.href = '../bigrat';
      return false;
    }

    function changeText(text) {
      document.querySelector('.dropdown span').innerHTML = text;
    }

    async function startPlayer() {
      const res = await fetch('/api/music');
      let playlist = await res.json();
      playlist = playlist.map(file => `/music/${encodeURIComponent(file)}`);
      playlist = playlist.sort(() => Math.random() - 0.5);

      const player = document.getElementById('audioPlayer');
      const source = document.getElementById('audioSource');
      let current = 0;

      function playNext() {
  if (current >= playlist.length) current = 0;

  source.src = playlist[current++];
  player.load();

  // Start muted so autoplay is allowed
  player.muted = true;

  player.play()
    .then(() => {
      // Unmute after playback starts successfully
      player.muted = false;
    })
    .catch(() => {
      // Retry after delay if blocked
      setTimeout(() => player.play(), 500);
    });

  updateNowPlaying(source.src);
}


      player.addEventListener('ended', playNext);
      playNext();

      function updateNowPlaying(src) {
        const filename = decodeURIComponent(src.split('/').pop());
        let artist = 'Unknown Artist';
        let song = filename;

        if (filename.includes(' - ')) {
          const parts = filename.split(' - ');
          artist = parts[0];
          song = parts.slice(1).join(' - ').replace(/\.\w+$/, '');
        } else {
          song = filename.replace(/\.\w+$/, '');
        }

        document.getElementById('songName').textContent = song;
        document.getElementById('artistName').textContent = artist;
      }
    }

    window.addEventListener('load', startPlayer);
